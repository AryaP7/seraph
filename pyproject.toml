[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seraph"
version = "0.1.0"
description = "SERAPH — Systemic Early-Risk Alert for Portfolio Health (NSE composite early-warning system)"
readme = "README-AI-SETUP.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "polars>=0.20",
    "pandas>=2.0",
    "statsmodels>=0.14",
    "pydantic>=2.5",
    "asyncpg>=0.29",
    "streamlit>=1.30",
    "requests>=2.31",
    "pypdf>=6.21.1",
]

[project.optional-dependencies]
research = ["arch>=8.0", "pyarrow>=20.0"]
# O02 — optional capabilities, declared rather than discovered at runtime.
#
# `live` is the broker websocket. `seraph/live/feed.py` imports kiteconnect
# lazily inside `KiteTickerFeed.connect()` and raises `FeedUnavailable` with
# an install instruction when it is absent, so the core install does not
# need it and a missing feed is never faked. Installing this extra does NOT
# grant market access: that needs credentials and a daily access token.
live = ["kiteconnect>=5.2"]
# `auth` is real identity verification. `seraph/identity/oidc.py` validates
# claims behind a signature-verifying provider; without this extra only the
# explicitly-isolated local demo principal is available.
auth = ["pyjwt[crypto]>=2.8"]
# NOTE: the browser audits (`scripts/audit_console_browser.py`,
# `scripts/verify_news_browser.py`) need no extra. They drive Microsoft Edge
# over the DevTools protocol using `websockets`, which streamlit already
# requires. Their requirement is a SYSTEM one -- Edge must be installed --
# and is documented in docs/OPERATIONS.md rather than pinned here.
# `tick` (X-DataInitiative) is the C5 Hawkes MLE baseline per AGENTS.md §2, but it
# has no wheels for Python 3.12 / Windows and needs a C++ toolchain to build.
# It is only required once C5 (L4, built last of the pillars) starts — keep it out
# of the core install so the rest of the system doesn't block on it.
hawkes = ["tick"]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.0",
]

[tool.setuptools.packages.find]
include = ["seraph*", "fixtures*"]

# QA03 — the canonical C12 frontend is a local Streamlit custom component, so
# its HTML/JS/CSS and the vendored Three.js licence are runtime assets, not
# docs. Without this they are silently dropped from a built wheel and the
# console renders as an empty iframe. `.bak`/`.broken` scratch copies are
# deliberately excluded.
[tool.setuptools.package-data]
"seraph.dashboard.console_component" = ["*.html", "*.js", "*.txt"]
"seraph.dashboard.assets" = ["*.html", "*.js", "*.css", "*.txt"]
"seraph.store" = ["*.sql"]
"seraph.ingestion" = ["*.csv"]
# O01 — seven runtime assets were missing from the wheel, for two different
# reasons, and the second is the one that is easy to get wrong:
#
#   1. `seraph/live/migrations/` and `seraph/news/curated/` had no
#      `__init__.py`, so `packages.find` never saw them. A `package-data`
#      entry for a directory setuptools does not consider a package attaches
#      to nothing. Both now have one.
#   2. A `package-data` glob does NOT recurse. `"seraph.store" = ["*.sql"]`
#      above ships `store/schema.sql` and says nothing about
#      `store/migrations/001_evaluation_identity.sql`, which is why that file
#      went missing even though `store/migrations/` IS a package.
#
# Symptoms in the audit's wheel probe: `no such table: runtime_head`, and a
# curated registry reporting 0 entities, 0 places, 0 assets and 0 edges.
"seraph.live.migrations" = ["*.sql"]
"seraph.store.migrations" = ["*.sql"]
"seraph.news.curated" = ["*.csv"]

[tool.setuptools.exclude-package-data]
"seraph.dashboard.assets" = ["*.bak", "*.broken"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
